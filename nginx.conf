# Cloud Run injects $PORT; nginx:alpine's default.conf normally hardcodes
# 80, so this listens on the port Cloud Run actually sets (8080 by default,
# see the Dockerfile's EXPOSE — kept here as a literal since Cloud Run's
# $PORT isn't available at nginx-config-eval time without an entrypoint
# template step, and this image only ever runs on Cloud Run's default port).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # vendor/ (wasm/onnx/etc) never reaches this container — the load
    # balancer routes /pose-tracker/vendor/* straight to a GCS backend
    # bucket instead (see bradjobe-dev-infra's lb.tf/pose_tracker_assets.tf),
    # so there's no matching location block for it here anymore.
    location /pose-tracker/ {
        try_files $uri $uri/ =404;
    }
}
